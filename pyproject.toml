[project]
name = "readability-metric"
version = "0.2.0"
description = "Readability metrics for EPUB books"
authors = [
  { name = "Roland Coeurjoly", email = "rolandcoeurjoly@gmail.com" },
]
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "EbookLib>=0.18",
  "jieba>=0.42",
  "langdetect>=1.0.9",
  "lxml>=5.0",
  "numpy>=1.26",
  "opencc>=1.1",
  "pymongo>=4.6",
  "scipy>=1.11",
  "spacy>=3.7",
]

[project.scripts]
readability-metric = "readability_metric:main"
story-pipeline = "story_pipeline:main"
subtitle-pipeline = "subtitle_pipeline:main"
subtitle-metadata = "subtitle_metadata:main"
vocabulary-pipeline = "vocabulary_pipeline:main"
vocabulary-quiz = "vocabulary_quiz:main"
book-recommendations = "book_recommendations:main"
book-tags = "book_tags:main"
palindromic-words = "palindromic_words:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["readability_metric", "corpus_analysis", "story_pipeline", "subtitle_pipeline", "subtitle_metadata", "vocabulary_pipeline", "vocabulary_quiz", "book_recommendations", "book_tags", "palindromic_words"]

[tool.ruff]
line-length = 100
